name: checks

on:
  push:
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENSPEC_TELEMETRY: '0'
  DO_NOT_TRACK: '1'

jobs:
  structural:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node bin/hub.mjs validate
      - run: npx --no-install openspec validate --all --strict --no-interactive

  # A fresh structural audit and requirement checklist. Semantic review stays a
  # separate, evidence-based task (skills/audit-canonical-specs/SKILL.md).
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: audit
        run: node bin/hub.mjs --root . specs audit > canonical-spec-audit.json 2> canonical-spec-audit-errors.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-spec-audit-${{ github.sha }}
          path: |
            canonical-spec-audit.json
            canonical-spec-audit-errors.json
      - if: steps.audit.outcome == 'failure'
        run: exit 1
