# Slices merge to main one at a time (spec links wait for a slice to start).
slices:
  - id: skill-frontmatter
    title: Keyword budget, shards and standard frontmatter for the routing skill
    implements:
      - repository-registry / Generated routing skill
      - repository-registry / Repository keywords and name bounds
      - repository-registry / Routing skill renders effective trigger names
      - repository-registry / Routing skill keyword budget
      - repository-registry / Routing skill shards
      - repository-registry / Standard frontmatter for generated skills
    paths: ["lib/repos.mjs", "lib/install.mjs", "lib/operations.mjs", "package.json", "scripts/skills-ref.mjs", "docs/format.md", "test/e2e/repos.test.mjs", "test/e2e/agents.test.mjs", "skills/context-kit/references/repositories.md", "openspec/changes/machine-setup/tasks.md"]
  - id: shared-skills
    title: Install into ~/.agents/skills, fewest locations, and move Codex's copies
    implements:
      - agent-installation / Install into agents
      - agent-installation / Shared skills location
      - agent-installation / Codex skills move to the shared location
      - agent-installation / Replaced skill copies
    paths: ["lib/install.mjs", "test/e2e/agents.test.mjs", "README.md", "skills/context-kit/references/addons-and-install.md", "openspec/changes/machine-setup/tasks.md"]
  - id: harnesses
    title: Gemini CLI, Copilot CLI and Cursor, with discovery checks
    implements:
      - agent-installation / Supported harnesses
      - agent-installation / Missing agents
      - agent-installation / Copies a harness may see twice
      - agent-installation / Harness discovery checks
      - agent-installation / Gemini CLI registration
      - agent-installation / Registration through config files
      - agent-installation / Project scope for more harnesses
      - agent-installation / One install at a time
      - agent-installation / Checked config edits
      - agent-installation / Previous versions of config files
    depends_on: [shared-skills]
    paths: ["lib/install.mjs", "bin/hub.mjs", "lib/help.mjs", "test/e2e/agents.test.mjs", "test/e2e/discovery.test.mjs", "test/manual-checks.md", "README.md", "skills/context-kit/references/**", "openspec/changes/machine-setup/tasks.md"]
  - id: portable-entry
    title: Launcher, path-free routing body, and moved-workspace repair
    implements:
      - agent-installation / Launcher
      - agent-installation / One workspace per user
      - agent-installation / Moved workspace
      - repository-registry / Routing without a workspace path
    depends_on: [skill-frontmatter]
    paths: ["lib/install.mjs", "lib/repos.mjs", "lib/operations.mjs", "test/e2e/agents.test.mjs", "test/e2e/repos.test.mjs", "skills/context-kit/references/**", "openspec/changes/machine-setup/tasks.md"]
  - id: setup-flow
    title: repos setup, scan depth and worktrees
    implements:
      - repository-registry / Scan a directory once
      - repository-registry / Machine setup
      - repository-registry / Worktrees are not recorded checkouts
    paths: ["lib/repos.mjs", "lib/operations.mjs", "lib/arguments.mjs", "bin/hub.mjs", "test/e2e/repos.test.mjs", "skills/context-kit/references/**", "openspec/changes/machine-setup/tasks.md"]
  - id: global-rule
    title: Optional Claude Code user rule
    implements:
      - agent-installation / Optional global rule
    depends_on: [portable-entry]
    paths: ["lib/install.mjs", "test/e2e/agents.test.mjs", "README.md", "skills/context-kit/references/addons-and-install.md", "openspec/changes/machine-setup/tasks.md"]
